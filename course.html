<!doctype html>
<html lang="ka">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>კურსი - Smart Academy</title>
<meta name="description" content="Smart Academy - კურსის დეტალური აღწერა, სილაბუსი, ლექტორი და რეგისტრაცია.">
<meta name="theme-color" content="#1B1E24">
<meta name="color-scheme" content="light dark">
<script>try{var t=localStorage.getItem("sa_theme");if(t)document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>

<link rel="icon" href="assets/img/logo-bl.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=Noto+Sans+Georgian:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/app.css">
</head>
<body data-page="courses">
<div id="site-header"></div>
<main id="course"></main>
<div id="site-footer"></div>
<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
<script>
document.addEventListener("sa:ready",function(){
  var SA=window.SA,I=SA.icon,e=SA.esc,id=+new URLSearchParams(location.search).get("id");
  var c=SA.course(id)||SA.courses[0],cat=SA.cat(c.cat),lects=c.lect.map(SA.lect).filter(Boolean);
  document.title=c.ka+" - Smart Academy";
  var fav=SA.favs().indexOf(c.id)>-1;
  var related=SA.courses.filter(function(x){return x.cat===c.cat&&x.id!==c.id}).sort(function(a,b){return a.sort-b.sort}).slice(0,3);
  var days=c.days.length?c.days:["განრიგი დაზუსტდება"];
  function dayCell(d){var m=d.match(/^(\S+)\s+(.+)$/);return '<div><small>'+e(m?m[1]:"")+'</small><b>'+e(m?m[2]:d)+'</b></div>'}
  document.getElementById("course").innerHTML=
  '<section class="cd-hero"><div class="container cd-grid"><div>'+
    '<nav class="crumbs" aria-label="breadcrumb"><a href="index.html">მთავარი</a>'+I("right")+'<a href="courses.html">კურსები</a>'+I("right")+'<a href="courses.html?cat='+c.cat+'">'+e(cat.name)+'</a></nav>'+
    '<div style="display:flex;gap:8px;margin-top:24px;flex-wrap:wrap"><span class="chip" style="background:'+cat.color+';color:#fff">'+e(cat.name)+'</span><span class="chip chip-dark" style="background:rgba(255,255,255,.1)">'+SA.fmt(c)+'</span>'+(c.rating?'<span class="chip chip-lime">★ '+c.rating.toFixed(1)+' · '+c.reviewsCount+' შეფასება</span>':"")+'</div>'+
    '<h1>'+e(c.ka)+'</h1>'+(c.sub?'<p class="subt">'+e(c.sub)+'</p>':"")+(c.en?'<p class="en">'+e(c.en)+'</p>':"")+
    '<div class="cd-facts"><div><small>დაწყება</small><b>'+(c.date||"მალე")+'</b></div><div><small>ხანგრძლივობა</small><b>'+SA.duration(c)+'</b></div><div><small>შეხვედრები</small><b>'+c.meetings+'</b></div><div><small>საათები</small><b>'+e(c.hours)+'</b></div></div>'+
    '<div class="cd-lects">'+lects.map(function(l){return '<a href="#lecturer">'+SA.av(l)+e(l.name)+'</a>'}).join("")+'</div>'+
  '</div><aside class="buy"><div class="cover"><img src="'+c.img+'" alt="'+e(c.ka)+'" width="880" height="462"></div><div class="buy-body">'+
    '<div class="buy-price"><b>'+c.price+' ₾</b></div>'+
    '<small style="color:var(--muted)">ან '+Math.ceil(c.price/6)+' ₾ / თვე - განვადებით</small>'+
    '<a class="btn btn-primary" href="#register">დარეგისტრირდი '+I("arrow")+'</a>'+
    '<button class="btn btn-ghost'+(fav?" on":"")+'" data-fav="'+c.id+'" type="button">'+I("heart")+' სასურველებში</button>'+
    '<ul><li>'+I("check")+SA.fmt(c)+'</li><li>'+I("check")+c.meetings+' შეხვედრა · '+e(c.hours)+'</li><li>'+I("check")+'Smart Academy-ის სერტიფიკატი</li><li>'+I("check")+'კარიერის განვითარების პროგრამა</li></ul>'+
  '</div></aside></div></section>'+
  '<div class="container cd-body"><div>'+
    (c.desc?'<section class="reveal"><h2>კურსის შესახებ</h2><p class="lead-text">'+e(c.desc)+'</p></section>':"")+
    (c.learn.length?'<section class="reveal"><h2>რას ისწავლი</h2><div class="learn">'+c.learn.map(function(l){return "<div>"+I("check")+"<span>"+e(l)+"</span></div>"}).join("")+'</div>'+(c.syllabus?'<a class="btn btn-ghost" style="margin-top:16px" href="'+c.syllabus+'" target="_blank" rel="noopener">'+I("pdf")+' სილაბუსის ჩამოტვირთვა</a>':"")+'</section>':"")+
    '<section class="reveal" id="lecturer"><h2>'+(lects.length>1?"ლექტორები":"ლექტორი")+'</h2>'+lects.map(function(l){return '<div class="teacher"><div class="ph">'+(l.photo?'<img src="'+l.photo+'" alt="'+e(l.name)+'" loading="lazy">':"")+'</div><div><b>'+e(l.name)+'</b>'+(l.pos?'<div class="pos">'+e(l.pos)+'</div>':"")+(l.bio.length?'<ul>'+l.bio.map(function(x){return "<li>"+e(x)+"</li>"}).join("")+'</ul>':"")+'<a class="more" href="'+l.url+'" target="_blank" rel="noopener">პროფილის ნახვა →</a></div></div>'}).join("")+'</section>'+
    '<section class="reveal" id="register"><h2>განრიგი</h2><div class="schedule"><div><small>დაწყების თარიღი</small><b>'+(c.date||"მალე")+'</b></div>'+days.slice(0,2).map(dayCell).join("")+'</div>'+
    '<div class="cta" style="margin-top:24px;padding:32px;border-radius:28px"><div><h2 style="font-size:26px">დაიკავე ადგილი ნაკადში</h2><p>ადგილების რაოდენობა შეზღუდულია</p></div><form id="reg-form"><label class="sr-only" for="rp">ტელეფონი</label><input id="rp" type="tel" placeholder="5XX XX XX XX" required pattern="[0-9 +]{9,16}"><button class="btn btn-dark" type="submit">რეგისტრაცია</button></form></div></section>'+
    (c.reviews.length?'<section class="reveal"><h2>სტუდენტების შეფასებები</h2><div class="rev-sum"><b>'+c.rating.toFixed(1)+'</b>'+SA.stars(5)+'<small>'+c.reviewsCount+' შეფასება</small></div><div class="reviews">'+c.reviews.map(function(r){return '<figure class="review" style="margin:0">'+SA.stars(r.rating)+'<p>'+e(r.quote)+'</p><figcaption class="who">'+(r.img?'<span class="av plain"><img src="'+r.img+'" alt="" loading="lazy"></span>':"")+'<b>'+e(r.name)+'</b></figcaption></figure>'}).join("")+'</div></section>':"")+
  '</div><div></div></div>'+
  (related.length?'<section class="section section-soft" style="margin-top:24px"><div class="container"><div class="section-head"><div><span class="kicker">მსგავსი კურსები</span><h2>შეიძლება დაგაინტერესოს</h2></div></div><div class="courses">'+related.map(SA.card).join("")+'</div></div></section>':"");
  document.getElementById("reg-form").addEventListener("submit",function(ev){ev.preventDefault();this.reset();SA.toast("რეგისტრაცია მიღებულია! მალე დაგიკავშირდებით")});
  SA.observe();
});
</script>
</body>
</html>
